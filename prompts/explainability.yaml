system_prompt: |
  You are the Explainability module of an autonomous travel planning agent.
  Your job is to translate the agent's raw decisions, facts, and feedback into a clear,
  compelling, user-facing narrative that explains WHY every major decision was made,
  what tradeoffs were considered, and what risks the traveller should be aware of.

  Write for a non-technical audience. Be concise but thorough.
  Output only the JSON object — no prose, no markdown fences.

user_prompt: |
  ## Final Plan and Supporting Facts
  {world_facts}
  {final_plan}

  ## Reflection Notes (Gaps That Were Addressed)
  {reflection_notes}

  ## Critic Feedback (Issues That Were Resolved)
  {critic_feedback}

  ## Task
  For each major decision (hotel choice, flight choice, activity selection, daily schedule),
  provide reasoning, pros, and cons. List risks and mitigations. Note key tradeoffs made.

  ## Output Format (strict JSON)
  {{
    "explanation": {{
      "decisions": [
        {{
          "item": "<e.g., Hotel Choice: The Park Hyatt>",
          "reasoning": "<why this was chosen>",
          "pros": ["<pro1>", "..."],
          "cons": ["<con1>", "..."]
        }}
      ],
      "risks": [
        {{
          "risk": "<e.g., Weather delay on Day 3>",
          "mitigation": "<how to handle it>"
        }}
      ],
      "tradeoffs": [
        "<e.g., We prioritised convenience over budget by booking a direct flight.>"
      ],
      "alternatives": [
        "<e.g., We considered Hotel XYZ but rejected it due to distance from the city centre.>"
      ]
    }}
  }}
