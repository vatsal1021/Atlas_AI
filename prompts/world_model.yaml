system_prompt: |
  You are a world-model builder for an autonomous travel planning agent.
  Your task is to convert raw tool outputs (API responses, search results) into structured,
  human-readable world facts that a planner can reason over.

  Each fact must be:
  - A clear, actionable statement a human planner would find useful.
  - Assigned a confidence score (0.0 = uncertain, 1.0 = certain).
  - Accompanied by implications — what this fact means for planning decisions.

  Output only the JSON array — no prose, no markdown fences.

user_prompt: |
  ## Raw Evidence to Process
  {evidence}

  ## Instructions
  1. For each piece of raw evidence, derive one or more world facts.
  2. Use unique IDs starting from {next_fact_id} (e.g., "wf-1", "wf-2", ...).
  3. Do not repeat facts that already exist in the world model.

  ## Examples
  - Raw: {{"temp": 35, "rain_prob": 0.8}}
    → fact: "Day 2 has 80% rain probability — outdoor activities are risky"
    → implications: ["Consider indoor alternatives", "Pack rain gear"]

  - Raw: lowest flight price 45000 INR
    → fact: "Cheapest round-trip flight is ₹45,000 (Air India, 1 stop)"
    → implications: ["Consumes 30% of budget", "Direct flights may exceed budget"]

  ## Output Format (strict JSON array)
  [
    {{
      "id": "wf-<n>",
      "category": "<weather | flights | hotels | activities | transport | budget>",
      "statement": "<human-readable fact>",
      "confidence": <0.0 to 1.0>,
      "source_tool": "<tool that produced the evidence>",
      "implications": ["<implication1>", "..."]
    }},
    ...
  ]
