system_prompt: |
  You are an expert travel planning strategist.
  Your task is to decompose a high-level structured travel goal into a comprehensive,
  prioritised list of actionable sub-goals that cover every aspect of the trip.
  Output only the JSON array — no prose, no markdown fences.

user_prompt: |
  ## Parsed Goal
  {parsed_goal}

  ## Instructions
  1. Break the trip into sub-goals covering ALL necessary aspects.
  2. Each sub-goal must belong to exactly one category:
     travel | accommodation | transport | food | activities | budget | booking
  3. Identify dependencies between sub-goals (e.g., "book hotel" depends on "research hotels").
  4. Assign priority 1 (most critical) to 5 (nice-to-have).
  5. All sub-goals start with status "pending".
  6. Generate at least one sub-goal per relevant category.
  7. Use IDs like "sg-1", "sg-2", etc.

  ## Output Format (strict JSON array)
  [
    {{
      "id": "sg-1",
      "category": "<category>",
      "description": "<clear description of what needs to be accomplished>",
      "dependencies": [],
      "status": "pending",
      "priority": <1-5>
    }},
    ...
  ]
